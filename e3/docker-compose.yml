services:
  pg:
    build: ./pg
    container_name: pge1
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 100
      start_period: 5s

  backend1app:
    build: ./backend
    container_name: nodeapp1e3
    command: ["node", "index1.mjs"]
    restart: unless-stopped
    environment:
      PGHOST: pg
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      pg:
        condition: service_healthy

  backend1:
    image: mitmproxy/mitmproxy:latest
    container_name: mitmproxy1e3
    restart: unless-stopped
    command: ["mitmweb", "--mode", "reverse:http://backend1app:8080", "-p", "9000", "--web-host", "0.0.0.0", "--web-port", "8081", "--no-web-open-browser", "--set", "web_password=e3"]
    ports:
      - "9000:9000"
      - "8081:8081"
    depends_on:
      - backend1app

  backend2:
    build: ./backend
    container_name: nodeapp2e3
    command: ["node", "index2.mjs"]
    restart: unless-stopped
    environment:
      PGHOST: pg
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    ports:
      - "8082:8082"
    depends_on:
      pg:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: nginxe3
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8888:8888"
    depends_on:
      - backend1
      - backend2

volumes:
  pgdata:
